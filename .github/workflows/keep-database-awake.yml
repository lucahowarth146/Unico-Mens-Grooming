# Free Supabase projects pause after about a week without any activity.
# This visits the database every 3 days so it never counts as inactive.
# It only reads the public list of services: it changes nothing.
name: Keep database awake

on:
  schedule:
    - cron: "17 6 */3 * *"   # 06:17 UTC every 3 days
  workflow_dispatch:          # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Visit the database
        run: |
          URL=$(grep -oE 'SUPABASE_URL = "[^"]+"' js/config.js | cut -d'"' -f2)
          KEY=$(grep -oE 'SUPABASE_ANON_KEY = "[^"]+"' js/config.js | cut -d'"' -f2)
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/services?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Database answered: $code"
          test "$code" = "200"
